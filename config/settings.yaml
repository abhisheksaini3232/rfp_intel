paths: {data_dir: data, storage_dir: storage, outputs_dir: outputs, logs_dir: logs}
ingestion: {min_page_chars: 20, ocr: {enabled: false, lang: eng}}
chunking: {max_tokens: 400, overlap_tokens: 60, min_tokens: 40}
embedding: {provider: local, model: BAAI/bge-small-en-v1.5, batch_size: 32,   # provider: local | openai
            query_prefix: "Represent this sentence for searching relevant passages: ",
            torch_threads: 0}         # local models: torch threads per process (0 = torch default)
vector_store: {kind: qdrant_local, collection: rfp_chunks}   # kind: qdrant_local | qdrant_server (QDRANT_URL in .env)
retrieval: {candidates_per_retriever: 30, rrf_k: 60, rerank_top_n: 20, final_top_k: 5,
            use_bm25: true, use_reranker: true}
retrieval_configs:            # named configs for eval and --config
  vector:        {use_bm25: false, use_reranker: false}
  hybrid:        {use_bm25: true,  use_reranker: false}
  hybrid_rerank: {use_bm25: true,  use_reranker: true}
reranker: {model: cross-encoder/ms-marco-MiniLM-L-6-v2, enabled: true, max_passages: 20}
# max_tokens 2000 -> 4000 -> 12000: reasoning models count hidden reasoning tokens against it, and the
# commercial/legal extractor with 12 passages per list field used all 4000 on reasoning (see docs/ASSUMPTIONS.md 7, 104)
llm: {temperature: 0, timeout_s: 90, max_json_retries: 1, max_tokens: 12000}
# Fallback provider: used automatically when LLM_PROVIDER has no key (LLM_API_KEY unset) or the
# key is rejected (401/403); needs ANTHROPIC_API_KEY (or OPENAI_API_KEY) in .env. EXTRACT_MODEL
# maps to extract_model, REASON_MODEL to reason_model.
llm_fallback: {enabled: true, provider: anthropic, extract_model: claude-haiku-4-5, reason_model: claude-opus-5}
agents: {max_field_retries: 2, parallel_extractors: true, min_confidence: 0.5,
         evidence_top_k: 6, widened_top_k: 10, qa_timeout_s: 120}
precedence: [addendum, rfp, bid_page, specs, affidavit, form, other]
eval: {recall_k: [1, 3, 5, 10]}
cost:                         # USD per 1k tokens, per model name; unknown models cost 0
  usd_per_1k_input:  {gpt-6-luna: 0.0001, gpt-5.4-mini: 0.00075, gpt-6-sol: 0.002,
                      claude-haiku-4-5: 0.001, claude-sonnet-5: 0.002, claude-opus-5: 0.005}
  usd_per_1k_output: {gpt-6-luna: 0.0005, gpt-5.4-mini: 0.0045, gpt-6-sol: 0.010,
                      claude-haiku-4-5: 0.005, claude-sonnet-5: 0.010, claude-opus-5: 0.025}
cache: {enabled: true, similarity_threshold: 0.95}   # semantic answer cache (invalidated when a bid is re-indexed)
api: {cors_origins: ["http://localhost:5173", "http://localhost:5174"],
      ask_workers: 2, ask_queue_max: 8,   # background questions: threads, and waiting runs before 429
      max_question_chars: 1000}
