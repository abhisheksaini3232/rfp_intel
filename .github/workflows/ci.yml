# CI: Python tests, frontend lint/test/build, and the retrieval evaluation on
# the shipped bids (no LLM key needed: indexing and search are local models).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch wheel, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        env:
          LLM_API_KEY: ci-fake-key          # tests never call a provider; the wrapper only checks presence
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the embedding and re-ranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('config/settings.yaml') }}
      - name: Install (CPU torch wheel, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Index the shipped bids
        run: |
          python main.py index --bid data/Bid1
          python main.py index --bid data/Bid2
      - name: Retrieval evaluation (fails under the recall@5 floor)
        run: python main.py eval retrieval --min-recall5 0.9
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: |
            eval/results/retrieval.md
            eval/results/retrieval.json
